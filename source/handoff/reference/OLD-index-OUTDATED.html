.tools{display:flex;align-items:center;gap:10px}
.lang{white-space:nowrap}.lang button{background:none;border:0;font:600 .85rem "DM Sans";color:var(--choc);cursor:pointer;padding:6px;opacity:.55}
.lang button[aria-pressed=true]{opacity:1;text-decoration:underline;text-underline-offset:4px}

@media(max-width:1180px){
 nav{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;background:var(--off);padding:14px 22px 22px;border-bottom:1px solid var(--champ);gap:6px}
 nav.open{display:flex}nav a{padding:10px 0}

}

.ph span{position:relative;z-index:2;font-size:.85rem;background:rgba(255,254,251,.85);padding:6px 12px;border-radius:999px;margin:0 12px}
.ph i{position:absolute;border-radius:50%;opacity:.9}
.ph.duo{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--champ)}
.ph.duo img{position:static}
.ph.car{display:block}.ph.car .trk{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.ph.car .trk::-webkit-scrollbar{display:none}.ph.car img{position:static;flex:0 0 100%;scroll-snap-align:center}.ph.car .nav{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,254,251,.9);color:var(--choc);font-size:22px;line-height:1;cursor:pointer;z-index:3}.ph.car .prev{left:8px}.ph.car .next{right:8px}

.hero .ph img{object-position:center 30%}
.story{display:grid;grid-template-columns:.8fr 1.2fr;gap:48px;align-items:center}
.story .ph{aspect-ratio:4/5;border-radius:200px 200px 24px 24px}

.hero .ph{aspect-ratio:4/5}

.steps li{counter-increment:s;border-left:1.5px solid var(--olive);padding-left:16px}

dialog{border:0;border-radius:18px;padding:0;width:min(92vw,520px);background:var(--off);color:var(--choc);overflow:hidden}

.lbt{padding:16px 20px 22px}.lbt p{font-size:.9rem;margin:0 0 12px}
#lbx{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,254,251,.9);color:var(--choc);font-size:1.4rem;cursor:pointer}

form{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:30px;background:var(--off);border:1px solid var(--champ);border-radius:20px;padding:28px}
form .full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:6px;font-size:.88rem;font-weight:500}
input,select,textarea{font:400 1rem "DM Sans";padding:.7rem .85rem;border:1.5px solid var(--champ);border-radius:10px;background:var(--off);color:var(--choc);width:100%}
input[aria-invalid=true],select[aria-invalid=true]{border-color:#9b3d2e}

.note{font-size:.85rem;background:var(--cream);border:1px dashed var(--olive);border-radius:10px;padding:10px 14px}

footer{background:var(--choc);color:var(--off);padding:56px 0 96px;font-size:.95rem}

.fgrid{display:grid;grid-template-columns:1.3fr 1fr 1.3fr;gap:36px}
.fl{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.copy{border-top:1px solid rgba(238,217,198,.35);margin-top:36px;padding-top:20px;text-align:center;font-size:.85rem}

.wa{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;width:56px;height:56px;border-radius:50%;background:var(--choc);display:grid;place-items:center;box-shadow:0 6px 18px rgba(107,74,63,.3)}
.wa svg{width:28px;height:28px;fill:var(--off)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
